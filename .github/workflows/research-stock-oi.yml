name: Research data – stock futures OI (manual, no alerts)
on:
  workflow_dispatch:
    inputs:
      mode: { description: "probe / fetch", default: "probe" }
      days: { description: "days per request (fetch)", default: "1000" }
      pages: { description: "pages per stock (fetch)", default: "3" }
      interval: { description: "ONE_DAY / ONE_HOUR", default: "ONE_DAY" }
concurrency: { group: research-stocks, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  oi:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m research.adapters.angel_stock_oi
        env:
          MODE: ${{ inputs.mode }}
          DAYS: ${{ inputs.days }}
          PAGES: ${{ inputs.pages }}
          IV: ${{ inputs.interval }}
          ANGEL_API_KEY:     ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID:   ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN:         ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      - name: Push OI data to branch research-stocks
        if: inputs.mode == 'fetch'
        run: |
          mkdir -p /tmp/o && cp research/data/angel/NFO_STK/*_OI_* research/data/angel/NFO_STK/manifest_oi.csv /tmp/o/
          git config user.name "option-bot research"; git config user.email "bot@users.noreply.github.com"
          git fetch -q origin research-stocks && git checkout -q -B research-stocks FETCH_HEAD
          cp /tmp/o/* research/data/angel/NFO_STK/ && git add research && git commit -qm "stock futures OI $(date -u +%F)" && git push -q origin research-stocks
