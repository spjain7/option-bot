name: Buy-Sell alerts (RSI + candlestick, Telegram)

# ALERTS ONLY – no orders, no auto-trading. RSI(14) > 75 + bearish reversal candle -> SELL alert,
# RSI < 25 + bullish reversal candle -> BUY alert, on 15-min, 1-hour and positional 3-hour candles.
# MCX futures + NIFTY/BANKNIFTY futures. State on branch "alerts-state"; Telegram sent only after the state push.

on:
  schedule:
    - cron: "2,17,32,47 3-18 * * 1-5"      # 08:32 → 00:17 IST, every 15 min, 2 min after each candle closes
  workflow_dispatch:
    inputs:
      telegram:
        description: "Send Telegram? 1 = yes, 0 = no"
        default: "1"

concurrency:
  group: buy-sell-alerts
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ALERTS_STATE_DIR: state/alerts
      ALERTS_TELEGRAM: ${{ github.event_name == 'schedule' && '1' || inputs.telegram }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: python -m alerts.tests.test_alerts
      - name: Restore alert state
        run: |
          set +e
          git ls-remote --exit-code --heads origin alerts-state > /dev/null
          rc=$?
          set -e
          mkdir -p state/alerts
          if [ "$rc" -eq 0 ]; then
            git fetch -q origin alerts-state && git archive FETCH_HEAD alerts | tar -x -C state
            test -f state/alerts/state.json || { echo "::error::alerts-state exists but state.json missing"; exit 1; }
          elif [ "$rc" -eq 2 ]; then
            echo "ALERTS_NEW_STATE=1" >> "$GITHUB_ENV"
          else
            echo "::error::cannot check alerts-state (git exit $rc)"; exit 1
          fi
      - name: Scan
        run: python -m alerts.run scan
        env:
          ANGEL_API_KEY:     ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID:   ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN:         ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      - name: Save state to branch alerts-state
        id: save
        if: always() && hashFiles('state/alerts/state.json') != ''
        run: |
          git config user.name "option-bot alerts"
          git config user.email "bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            rm -rf /tmp/as && git worktree prune
            if git ls-remote --exit-code --heads origin alerts-state > /dev/null; then
              git fetch -q origin alerts-state && git worktree add -q /tmp/as FETCH_HEAD
            else
              git worktree add -q --detach /tmp/as && (cd /tmp/as && git checkout -q --orphan alerts-state && git rm -rqf --ignore-unmatch .)
            fi
            mkdir -p /tmp/as/alerts && cp state/alerts/state.json /tmp/as/alerts/
            (cd /tmp/as && git add alerts && (git diff --cached --quiet || git commit -qm "alert state $(date -u +%F_%H%M)") \
              && git push -q origin HEAD:refs/heads/alerts-state) && { echo "state saved"; exit 0; }
            sleep 5
          done
          echo "::error::could not push alerts-state"; exit 1
      - name: Send Telegram
        if: always() && hashFiles('state/alerts/outbox.json') != ''
        run: python -m alerts.run flush
        env:
          SAVE_OK: ${{ steps.save.outcome == 'success' && 'success' || 'failure' }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
