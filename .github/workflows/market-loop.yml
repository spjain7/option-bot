name: Market loop (option selling + option buying + futures calls, every 15 min)

# GitHub's cron skips many scheduled runs, so ONE run per trading day loops inside the jobs instead (a scan every 15 min,
# 2 min after each candle closes). Three back-to-back jobs (each < 6 h) cover 08:55 IST -> 00:20 IST (NSE 09:15-15:30, MCX 09:00-23:30/23:55):
#   morning -> 14:50, afternoon -> 19:50, evening -> 00:20.
# Many backup start times (every ~30-90 min, Mon-Fri): if one is skipped by GitHub the next one starts the loop. A start that comes
# while the loop is already running just waits in the queue (same concurrency group) and exits at once when it gets its turn;
# a start outside 08:40-00:20 IST, or on a weekend, exits immediately (scripts/market_loop.sh), so no run ever idles through the night.
# ALERTS / PAPER only - no orders.

on:
  schedule:                    # UTC (IST = UTC + 5:30). 3-Nov: odd minutes – GitHub dropped EVERY :00/:15/:45 morning start on 2-Nov and
                               # 3-Nov (loop began 16:15 IST, NSE missed); busy top-of-hour slots are shed first.
                               # self-start chain: the evening job dispatches standby.yml, which starts the next day's loop at 08:41 IST.
    - cron: "13 3 * * 1-5"     # 08:43 IST  - first start
    - cron: "22 3 * * 1-5"     # 08:52 IST
    - cron: "37 3 * * 1-5"     # 09:07 IST  - backups from here on
    - cron: "53 3 * * 1-5"     # 09:23
    - cron: "19 4 * * 1-5"     # 09:49
    - cron: "41 4 * * 1-5"     # 10:11
    - cron: "7 5 * * 1-5"      # 10:37
    - cron: "38 5 * * 1-5"     # 11:08
    - cron: "11 6 * * 1-5"     # 11:41
    - cron: "43 6 * * 1-5"     # 12:13
    - cron: "17 7 * * 1-5"     # 12:47
    - cron: "9 8 * * 1-5"      # 13:39
    - cron: "4 9 * * 1-5"      # 14:34
    - cron: "33 10 * * 1-5"    # 16:03
    - cron: "13 12 * * 1-5"    # 17:43
    - cron: "11 14 * * 1-5"    # 19:41
    - cron: "3 16 * * 1-5"     # 21:33
  workflow_dispatch:
  push:                        # emergency start: a commit that changes .github/kick starts the loop (GitHub skipped every cron on 28-Oct)
    branches: [main]
    paths: [".github/kick"]

concurrency:
  group: market-loop
  cancel-in-progress: false

permissions:
  contents: write
  actions: write               # 3-Nov: the evening job starts standby.yml, which starts tomorrow's loop (self-starting chain)

env:
  ALERTS_STATE_DIR: state/alerts
  ALERTS_TELEGRAM: "1"
  OBUY_STATE_DIR: state/obuy
  OBUY_TELEGRAM: "1"
  ANGEL_API_KEY:     ${{ secrets.ANGEL_API_KEY }}
  ANGEL_CLIENT_ID:   ${{ secrets.ANGEL_CLIENT_ID }}
  ANGEL_PIN:         ${{ secrets.ANGEL_PIN }}
  ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
  # website price snapshot (share.py); without these two secrets nothing is sent
  PR_FEED_URL: https://pokharna-company-xray-api.pokharnaresearch.workers.dev
  PR_FEED_KEY: ${{ secrets.PR_FEED_KEY }}
  TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
  CALLMEBOT_PHONE:   ${{ secrets.CALLMEBOT_PHONE }}
  CALLMEBOT_APIKEY:  ${{ secrets.CALLMEBOT_APIKEY }}
  GITHUB_TOKEN:      ${{ github.token }}

jobs:
  morning:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m alerts.tests.test_alerts
      - run: python -m alerts.tests.test_tradeplan
      - run: bash scripts/market_loop.sh 14:50
  afternoon:
    needs: morning
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: bash scripts/market_loop.sh 19:50
  evening:
    needs: afternoon
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: bash scripts/market_loop.sh 00:20
      - name: Start tomorrow's loop (standby.yml waits until 08:41 IST, then starts this workflow)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/standby.yml/dispatches" -f ref=main || echo "standby start failed – the cron starts remain"
