name: Research data – stock futures (daily + manual, no alerts)
# 19-Nov-2026 (owner: "make sure to download it daily"): runs every weekday night at 01:22 IST (Tue-Sat), after the live
# market loop's quiet-hours window opens (00:30 IST), then starts the stock-futures OI fetch. Read-only Angel calls, no alerts.
on:
  schedule:
    - cron: "52 19 * * 1-5"          # 01:22 IST Tue-Sat (after each weekday session)
  workflow_dispatch:
concurrency:
  group: research-stocks
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Angel quiet-hours guard (shares the live bot's API key – 7-Nov)
        env: { FORCE: "${{ inputs.force }}", WAIT_MIN: "15" }
        run: python3 scripts/angel_quiet_hours.py
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Fetch stock-futures history (read-only)
        run: python -m research.adapters.angel_stocks
        env:
          ANGEL_API_KEY:     ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID:   ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN:         ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      - name: Push to branch research-stocks
        run: |
          mkdir -p /tmp/o && cp -r research/data/angel/NFO_STK /tmp/o/
          git config user.name "option-bot research"; git config user.email "bot@users.noreply.github.com"
          git checkout --orphan research-stocks && git rm -rqf --ignore-unmatch . && rm -rf research
          mkdir -p research/data/angel && cp -r /tmp/o/NFO_STK research/data/angel/
          git add research && git commit -qm "stock futures 1h $(date -u +%F)" && git push -qf origin research-stocks
      - name: Start the stock-futures OI fetch (adds OI files to the same branch)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/research-stock-oi.yml/dispatches" -f ref=main -f "inputs[mode]=fetch" || echo "OI dispatch failed"
