name: Research data (manual, no alerts)

# Downloads REAL MCX + NSE index-futures candles from Angel One for backtesting.
# Manual only. NOTE (7-Nov): group 'option-bot' is the OLD bot's, not market-loop's – it CAN overlap the live loop
# (it did on 6-Nov 15:15-20:16 IST); the quiet-hours guard step now stops it during loop hours. Sends no Telegram messages.
# Results are pushed to the separate branch "research-data" (main is never touched).

on:
  workflow_dispatch:
    inputs:
      names:
        description: "Only these instruments, comma separated (empty = all)"
        default: ""
      dataset:
        description: "futures (MCX + index futures) or nse_eq (NSE cash equities: Nifty 500 daily + liquid stocks 5-min)"
        default: "futures"
      intervals:
        description: "Candle intervals, comma separated (ONE_DAY, ONE_HOUR, FIFTEEN_MINUTE, FIVE_MINUTE, THREE_MINUTE, ONE_MINUTE)"
        default: "ONE_DAY,ONE_HOUR"

concurrency:
  group: option-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Angel quiet-hours guard (shares the live bot's API key – 7-Nov)
        env: { FORCE: "${{ inputs.force }}" }
        run: python3 scripts/angel_quiet_hours.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore earlier research data (for partial re-fetch)
        run: |
          git fetch -q origin research-data && git archive FETCH_HEAD research/data/angel | tar -x -C . || true
      - name: Wait until the live loop's day is over (00:25 IST) – never compete with live alerts for the Angel quota
        run: |
          m=$(( 10#$(TZ=Asia/Kolkata date +%H) * 60 + 10#$(TZ=Asia/Kolkata date +%M) ))
          if [ "$m" -ge 500 ]; then s=$(( (1440 - m + 25) * 60 )); if [ "$s" -gt 14400 ]; then echo "::error::would wait $((s/60)) min – longer than the job limit. Start this run between 00:25 and 08:20 IST (or after ~20:25 IST)."; exit 1; fi; echo "waiting $((s/60)) min"; sleep "$s"; elif [ "$m" -lt 25 ]; then sleep $(( (25 - m) * 60 )); fi
      - name: Fetch Angel history (research only)
        run: |
          if [ "${{ github.event.inputs.dataset }}" = "nse_eq" ]; then python -m research.adapters.angel_eq; else python -m research.adapters.angel_hist; fi
        env:
          ANGEL_API_KEY:     ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID:   ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN:         ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          RESEARCH_NAMES:    ${{ github.event.inputs.names }}
          RESEARCH_INTERVALS: ${{ github.event.inputs.intervals || 'ONE_DAY,ONE_HOUR' }}
      - name: Push to research-data branch (also after a timeout, so partial downloads are kept – fetcher is resumable)
        if: always() && hashFiles('research/data/angel/**') != ''
        run: |
          mkdir -p /tmp/out && cp -r research/data/angel /tmp/out/
          git config user.name "option-bot research"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin research-data && git checkout research-data || git checkout --orphan research-data
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p research/data && cp -r /tmp/out/angel research/data/
          git add research/data/angel
          git commit -qm "Angel research data $(date -u +%F_%H%M)" && git push -q origin research-data
